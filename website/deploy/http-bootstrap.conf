server {
    listen 80;
    listen [::]:80;
    server_name dj.generik.au generik.glasscode.academy;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://dj.generik.au$request_uri; }
    access_log off;
    error_log /var/log/nginx/generik-error.log warn;
}
